<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="FRATAM Junior School - Excelling is Our Goal. Quality education, discipline, confidence, creativity and good character.">

    <title>FRATAM Junior School. | Excelling is Our Goal</title>

    <!-- Google Fonts -->

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <style>

        /* =====================================================
           GENERAL
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Poppins', sans-serif;
            color: #222;
            background: #fff;
            line-height: 1.7;
        }

        a {
            text-decoration: none;
        }

        img {
            max-width: 100%;
            display: block;
        }


        /* =====================================================
           NAVIGATION
        ===================================================== */

        .navbar {
            width: 100%;
            min-height: 85px;
            background: #0F2C59;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 6%;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,.15);
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .badge-icon {
            width: 62px;
            height: 70px;
            object-fit: contain;
        }

        .brand-name {
            color: #fff;
            font-size: 23px;
            font-weight: 800;
            line-height: 1.1;
        }

        .brand-name span {
            display: block;
            color: #C5A059;
            font-size: 11px;
            letter-spacing: 2px;
            margin-top: 4px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 25px;
            list-style: none;
        }

        .nav-links a {
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            transition: .3s ease;
        }

        .nav-links a:hover {
            color: #C5A059;
        }

        .btn-enroll {
            background: #C5A059;
            padding: 11px 20px;
            border-radius: 25px;
            color: #0F2C59 !important;
        }

        .btn-enroll:hover {
            background: #fff;
            color: #0F2C59 !important;
        }

        .mobile-toggle {
            display: none;
            width: 42px;
            height: 40px;
            border: none;
            background: transparent;
            cursor: pointer;
            flex-direction: column;
            justify-content: center;
            gap: 6px;
        }

        .mobile-toggle span {
            display: block;
            width: 28px;
            height: 3px;
            background: #fff;
            border-radius: 5px;
            transition: .3s ease;
        }


        /* =====================================================
           HERO
        ===================================================== */

        .hero {
            min-height: 650px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 80px 20px;
            background:
                linear-gradient(
                    rgba(15,44,89,.88),
                    rgba(15,44,89,.88)
                ),
                url("ChatGPT Image Aug 2, 2026, 08_53_58 AM.png")
                center/cover no-repeat;
        }

        .slide-content {
            max-width: 900px;
            color: #fff;
        }

        .slide-content h1 {
            font-size: clamp(38px, 6vw, 70px);
            font-weight: 900;
            text-transform: uppercase;
            margin: 25px 0 15px;
            color: #fff;
        }

        .slide-content p {
            max-width: 750px;
            margin: auto;
            font-size: 18px;
            color: #f2f2f2;
        }

        .hero-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .btn-primary,
        .btn-secondary {
            display: inline-block;
            padding: 13px 25px;
            border-radius: 30px;
            font-weight: 700;
            transition: .3s ease;
        }

        .btn-primary {
            background: #C5A059;
            color: #0F2C59;
        }

        .btn-secondary {
            border: 2px solid #fff;
            color: #fff;
        }

        .btn-primary:hover,
        .btn-secondary:hover {
            transform: translateY(-3px);
        }

        .btn-primary:hover {
            background: #fff;
        }

        .btn-secondary:hover {
            background: #fff;
            color: #0F2C59;
        }


        /* =====================================================
           GENERAL SECTION
        ===================================================== */

        section {
            padding: 80px 7%;
        }

        .section-title {
            text-align: center;
            margin-bottom: 45px;
        }

        .section-title h2 {
            color: #0F2C59;
            font-size: 38px;
            font-weight: 800;
        }

        .section-title p {
            color: #666;
            max-width: 750px;
            margin: 10px auto 0;
        }

        .section-title::after {
            content: "";
            display: block;
            width: 70px;
            height: 4px;
            background: #C5A059;
